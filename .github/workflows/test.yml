name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: CLI syntax check
        run: node --check packages/cli/bin/zeroshot.js
      - name: Worker syntax check
        run: node --check packages/api/src/index.js
      - name: flavors.json valid + mixes sum to 24
        run: node -e "const f=require('./flavors/flavors.json');for(const[k,b]of Object.entries(f.builds)){if(!b.mix)continue;const s=Object.values(b.mix).reduce((a,c)=>a+c,0);if(s!==24)throw new Error(k+' sums to '+s)};console.log('ok')"
      - name: Install API deps
        run: cd packages/api && npm ci
      - name: API + CLI tests (against local wrangler dev)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          cd packages/api
          # The whole suite runs from one IP inside a minute, so production's
          # 60/min limiter would fail it on 429 rather than on anything real.
          printf 'SKILL_SIGNING_SECRET=ci-test-secret\nADMIN_BEARER=ci-test-admin\nRATE_LIMIT_GENERAL=100000\nRATE_LIMIT_RECOMMEND=100000\n' > .dev.vars
          npx wrangler d1 execute zeroshot --file=./schema.sql -y
          npx wrangler dev --port 8787 &
          for i in $(seq 1 90); do curl -sf http://localhost:8787/v1/status >/dev/null && break; sleep 2; done
          cd ../..
          ZEROSHOT_API_URL=http://localhost:8787 ZEROSHOT_TEST_WRITES=1 ZEROSHOT_ADMIN_BEARER=ci-test-admin node --test packages/api/test/*.test.js packages/cli/test/*.test.js
      - name: Eval harness dry-run smoke
        run: |
          # Defaults target caffeine, whose source and tasks are both in this
          # repo, so the dry run needs no stand-in file fabricated for it.
          cd packages/evals && node run.mjs --dry-run --trials 1
      - name: Probe instrument
        run: |
          cd packages/evals
          node --test test/detector.test.js
          for t in skills/caffeine/tasks/*/task.json; do node verify-task.mjs "$t"; done
          for t in skills/caffeine/stress-tasks/*/task.json; do node verify-task.mjs "$t" --long; done
          node probe.mjs --dry-run --trials 1 --model claude-sonnet-5
